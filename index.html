<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Bot - RAG Document Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-light: #ecfdf5;
            --accent: #6366f1;
            --gray-card: #f1f5f9;
            --gray-card-hover: #e2e8f0;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --border-radius-lg: 16px;
            --border-radius-xl: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            left: -320px;
            top: 0;
            bottom: 0;
            width: 320px;
            background-color: var(--container-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            z-index: 100;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .sidebar-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        .doc-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .doc-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: var(--gray-card);
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .doc-icon {
            margin-right: 10px;
            color: #ef4444;
            flex-shrink: 0;
        }

        .doc-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .reset-db-btn {
            width: 100%;
            padding: 12px;
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            border-radius: 12px;
            font-family: var(--font-body);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .reset-db-btn:hover {
            background-color: #fecaca;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ── App Container ── */
        .app-container {
            width: 100%;
            max-width: 1000px;
            height: 95vh;
            background-color: var(--container-bg);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 8px;
        }

        .hamburger-btn:hover {
            background-color: var(--gray-card);
        }

        .logo-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .model-selector-container {
            position: relative;
        }

        .model-selector {
            appearance: none;
            -webkit-appearance: none;
            background-color: var(--gray-card);
            border: none;
            padding: 10px 36px 10px 16px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .model-selector:hover {
            background-color: var(--gray-card-hover);
        }

        .model-selector-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
        }

        .new-chat-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--primary-hover);
        }

        .header-right {
            position: relative;
            width: 200px;
        }

        .search-input {
            width: 100%;
            background-color: var(--gray-card);
            border: none;
            padding: 10px 16px 10px 36px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: background-color 0.2s;
        }

        .search-input:focus {
            background-color: var(--gray-card-hover);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* ── Workspace ── */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            padding: 24px;
        }

        /* ── Dashboard ── */
        .dashboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 800px;
            margin: auto;
            width: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .dashboard.hidden {
            display: none;
            opacity: 0;
            transform: translateY(-20px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 24px;
        }

        .grid-card {
            background-color: var(--gray-card);
            border: 1px solid transparent;
            border-radius: var(--border-radius-lg);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            min-height: 160px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .grid-card:hover {
            background-color: #fff;
            border-color: var(--border-color);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .card-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .grid-card:hover .card-icon-wrapper {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
        }

        .upload-strip {
            width: 100%;
            background-color: var(--gray-card);
            border-radius: var(--border-radius-lg);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 40px;
            border: 1px dashed transparent;
        }

        .upload-strip:hover {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .upload-strip-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
        }

        .upload-strip-text {
            font-size: 15px;
            font-weight: 500;
        }

        .welcome-title {
            font-family: var(--font-display);
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        /* ── Chat ── */
        .chat-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            flex: 1;
        }

        .chat-view.hidden {
            display: none;
        }

        .messages-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
            max-width: 85%;
        }

        .message-bubble {
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-md);
        }

        .message.assistant .message-bubble {
            background-color: var(--gray-card);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* ── FIX: Query timer badge ── */
        .query-timer {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            padding-left: 4px;
        }

        /* ── Sources ── */
        .message-sources {
            margin-top: 8px;
            font-size: 13px;
        }

        .sources-trigger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            padding: 4px 8px;
            border-radius: 6px;
            background-color: var(--primary-light);
            transition: opacity 0.2s;
        }

        .sources-trigger:hover {
            opacity: 0.8;
        }

        .sources-content {
            display: none;
            margin-top: 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #fff;
            overflow: hidden;
            animation: slideDown 0.2s ease;
        }

        .sources-content.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }

            to {
                opacity: 1;
                max-height: 500px;
            }
        }

        .source-card {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
        }

        .source-card:last-child {
            border-bottom: none;
        }

        .source-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .source-score {
            color: var(--primary);
        }

        .source-text {
            color: var(--text-main);
            line-height: 1.4;
            font-family: monospace;
            background-color: #fafafa;
            padding: 8px;
            border-radius: 6px;
            overflow-x: auto;
            max-height: 120px;
            overflow-y: auto;
        }

        /* ── Typing indicator ── */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1.0);
            }
        }

        /* ── FIX: Thinking status line shown before first token ── */
        .thinking-status {
            font-size: 12px;
            color: var(--text-muted);
            padding: 2px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ── Input ── */
        .input-wrapper {
            padding: 16px 24px 24px 24px;
            flex-shrink: 0;
        }

        .input-panel {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--gray-card);
            border-radius: var(--border-radius-lg);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .input-panel:focus-within {
            background-color: #fff;
            border-color: var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .input-textarea {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            resize: none;
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--text-main);
            min-height: 48px;
            max-height: 160px;
            line-height: 1.5;
        }

        .input-textarea::placeholder {
            color: var(--text-muted);
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .input-footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .attachment-btn {
            background: #fff;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .attachment-btn:hover {
            background-color: var(--gray-card-hover);
        }

        .pill-btn {
            background-color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .pill-btn:hover {
            background-color: var(--gray-card);
        }

        .send-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            transition: transform 0.2s, color 0.2s;
        }

        .send-btn:hover {
            color: var(--accent);
            transform: scale(1.1);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ── FIX: Toast — rebuilt cleanly, no stacking spinner bug ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--text-main);
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 320px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid var(--primary);
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        .toast.info {
            border-left: 4px solid #6366f1;
        }

        .toast-spinner {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Indexed Documents</div>
            <button class="close-sidebar-btn" id="closeSidebarBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="doc-list" id="docList"></div>
        <button class="reset-db-btn" id="resetDbBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Reset Database & Clear PDFs
        </button>
    </div>

    <div class="app-container">

        <header class="header">
            <div class="header-left">
                <button class="hamburger-btn" id="hamburgerBtn" title="Manage Documents">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="logo-title">AI Chat Bot</div>
            </div>
            <div class="header-center">
                <div class="model-selector-container">
                    <select class="model-selector" id="modelSelector">
                        <optgroup label="⚡ Groq (Ultra-Fast Cloud)">
                            <option value="groq/compound-mini" selected>Groq Compound Mini (Ultra-Fast) ⚡</option>
                            <option value="groq/compound">Groq Compound (Powerful)</option>
                            <option value="qwen/qwen3.8-27b">Qwen 3.8 27B (Groq)</option>
                        </optgroup>
                        <optgroup label="✨ Gemini (Google Cloud)">
                            <option value="gemini-flash-latest">Gemini Flash (Fast & Free) ✨</option>
                            <option value="gemini-pro-latest">Gemini Pro (Smart)</option>
                            <option value="gemini-flash-lite-latest">Gemini Flash Lite</option>
                        </optgroup>
                    </select>
                    <svg class="model-selector-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    New Chat
                </button>
            </div>
            <div class="header-right">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Search tool here">
            </div>
        </header>

        <main class="workspace" id="workspace">

            <div class="dashboard" id="dashboard">
                <div class="grid-container">
                    <div class="grid-card"
                        data-query="Explain the report writing and documentation guidelines for security guards.">
                        <div class="card-icon-wrapper"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg></div>
                        <div class="card-title">Report Writing & Documentation</div>
                    </div>
                    <div class="grid-card"
                        data-query="What are the essential guidelines for maintaining a notebook as a security guard?">
                        <div class="card-icon-wrapper"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            </svg></div>
                        <div class="card-title">Notebook Guidelines & Protocols</div>
                    </div>
                    <div class="grid-card"
                        data-query="How should a security guard interview and record witness statements?">
                        <div class="card-icon-wrapper"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg></div>
                        <div class="card-title">Witness Statements & Interviews</div>
                    </div>
                    <div class="grid-card"
                        data-query="Explain the health and safety regulations applicable to security work.">
                        <div class="card-icon-wrapper"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg></div>
                        <div class="card-title">Health, Safety & Regulations</div>
                    </div>
                    <div class="grid-card"
                        data-query="What legal authority and arrest powers do security guards possess?">
                        <div class="card-icon-wrapper"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg></div>
                        <div class="card-title">Legal Implications & Authority</div>
                    </div>
                    <div class="grid-card"
                        data-query="What emergency response procedures should security guards perform during a crisis?">
                        <div class="card-icon-wrapper"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                                </path>
                                <line x1="12" y1="9" x2="12" y2="13"></line>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg></div>
                        <div class="card-title">Emergency & Crisis Response</div>
                    </div>
                </div>
                <div class="upload-strip" id="uploadStrip">
                    <div class="upload-strip-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg></div>
                    <div class="upload-strip-text" id="uploadStripText">Do you want to upload and index a PDF file?
                    </div>
                </div>
                <h2 class="welcome-title">How Can I Help you?</h2>
            </div>

            <div class="chat-view hidden" id="chatView">
                <div class="messages-container" id="messagesContainer"></div>
            </div>

        </main>

        <input type="file" id="fileInput" accept=".pdf" style="display:none;">

        <div class="input-wrapper">
            <div class="input-panel">
                <textarea class="input-textarea" id="chatInput" placeholder="Write here to Start Chat....."
                    rows="1"></textarea>
                <div class="input-footer">
                    <div class="input-footer-left">
                        <button class="attachment-btn" id="attachmentBtn" title="Upload PDF Document">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                                </path>
                            </svg>
                        </button>
                        <button class="pill-btn" id="recentChatPill">Clear History</button>
                        <button class="pill-btn" id="promptSuggestionsPill">Toggle Topics</button>
                    </div>
                    <button class="send-btn" id="sendBtn" title="Send message">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIX: Toast rebuilt — single spinner element, no stacking -->
    <div class="toast" id="toast">
        <div class="toast-spinner" id="toastSpinner" style="display:none;"></div>
        <span id="toastText"></span>
    </div>

    <script>
        const dashboard = document.getElementById('dashboard');
        const chatView = document.getElementById('chatView');
        const messagesContainer = document.getElementById('messagesContainer');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachmentBtn = document.getElementById('attachmentBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadStrip = document.getElementById('uploadStrip');
        const uploadStripText = document.getElementById('uploadStripText');
        const newChatBtn = document.getElementById('newChatBtn');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const docList = document.getElementById('docList');
        const resetDbBtn = document.getElementById('resetDbBtn');
        const recentChatPill = document.getElementById('recentChatPill');
        const promptSuggPill = document.getElementById('promptSuggestionsPill');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const toastSpinner = document.getElementById('toastSpinner');

        let isChatActive = false;
        let activeStream = null;   // track open EventSource so we can cancel it
        let toastTimer = null;

        // ── Auto-resize textarea ──
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = chatInput.scrollHeight + 'px';
        });

        // ── File upload triggers ──
        attachmentBtn.addEventListener('click', () => fileInput.click());
        uploadStrip.addEventListener('click', () => fileInput.click());

        // ── Sidebar ──
        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('show');
            loadDocumentsList();
        });
        closeSidebarBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('show');
        }

        // ── Toggle topics ──
        promptSuggPill.addEventListener('click', () => {
            if (isChatActive) dashboard.classList.toggle('hidden');
        });

        // ── FIX: Toast — clean function, no stacking ──
        function showToast(message, type = 'info', duration = 3000, loading = false) {
            clearTimeout(toastTimer);
            toastText.textContent = message;
            toastSpinner.style.display = loading ? 'block' : 'none';
            toast.className = `toast show ${type}`;
            if (!loading && duration > 0) {
                toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
            }
        }
        function hideToast() {
            clearTimeout(toastTimer);
            toast.classList.remove('show');
        }

        // ── Load document list ──
        async function loadDocumentsList() {
            try {
                const res = await fetch('/api/documents');
                const data = await res.json();
                docList.innerHTML = '';
                if (data.documents && data.documents.length > 0) {
                    data.documents.forEach(doc => {
                        const item = document.createElement('div');
                        item.className = 'doc-item';
                        item.innerHTML = `
                        <svg class="doc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        <span class="doc-name" title="${doc}">${doc}</span>`;
                        docList.appendChild(item);
                    });
                } else {
                    docList.innerHTML = '<div style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px;">No PDFs uploaded yet.</div>';
                }
            } catch (err) { console.error('Doc list error:', err); }
        }

        // ── Upload PDF ──
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            uploadStripText.textContent = 'Indexing document, please wait...';
            showToast(`Uploading "${file.name}"...`, 'info', 0, true);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    uploadStripText.textContent = 'Upload another PDF?';
                    loadDocumentsList();
                } else {
                    showToast(data.error || 'Indexing failed', 'error');
                    uploadStripText.textContent = 'Upload failed. Try again?';
                }
            } catch (err) {
                showToast('Network error during upload.', 'error');
                uploadStripText.textContent = 'Upload failed. Try again?';
            } finally {
                fileInput.value = '';
            }
        });

        // ── Reset DB ──
        resetDbBtn.addEventListener('click', async () => {
            if (!confirm('Clear the vector database and all PDFs? This cannot be undone.')) return;
            showToast('Resetting database...', 'info', 0, true);
            try {
                const res = await fetch('/api/reset', { method: 'POST' });
                const data = await res.json();
                if (data.success) { showToast('Database cleared.', 'success'); loadDocumentsList(); clearChat(); }
                else { showToast(data.error || 'Reset failed', 'error'); }
            } catch { showToast('Network error resetting database.', 'error'); }
        });

        // ── Grid card clicks ──
        document.querySelectorAll('.grid-card').forEach(card => {
            card.addEventListener('click', () => submitQuery(card.dataset.query));
        });

        // ── Send button / Enter key ──
        sendBtn.addEventListener('click', () => {
            const text = chatInput.value.trim();
            if (text) { submitQuery(text); chatInput.value = ''; chatInput.style.height = 'auto'; }
        });
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
        });

        // ── Main query function ──
        function submitQuery(queryText) {
            if (!queryText) return;

            // Cancel any in-progress stream
            if (activeStream) { activeStream.close(); activeStream = null; }

            // Transition to chat view
            if (!isChatActive) {
                dashboard.classList.add('hidden');
                chatView.classList.remove('hidden');
                isChatActive = true;
            }

            // User bubble
            appendUserMessage(queryText);

            // Assistant bubble with typing indicator + thinking status
            const msgId = 'msg-' + Date.now();
            const msgNode = document.createElement('div');
            msgNode.className = 'message assistant';
            msgNode.id = msgId;
            msgNode.innerHTML = `
            <div class="message-bubble" id="bubble-${msgId}">
                <div class="typing-indicator"><span></span><span></span><span></span></div>
                <div class="thinking-status" id="status-${msgId}">
                    ⏳ Searching documents &amp; generating answer...
                </div>
            </div>`;
            messagesContainer.appendChild(msgNode);
            scrollToBottom();

            // Disable send while streaming
            sendBtn.disabled = true;

            const bubble = document.getElementById(`bubble-${msgId}`);
            const startTime = Date.now();
            let streamedText = '';
            let sourcesData = [];
            let firstToken = true;

            const selectedModel = modelSelector.value;
            const evtSource = new EventSource(`/api/query/stream?query=${encodeURIComponent(queryText)}&model=${encodeURIComponent(selectedModel)}`);
            activeStream = evtSource;

            evtSource.onmessage = e => {
                const data = JSON.parse(e.data);
                if (data.token !== undefined) {
                    if (firstToken) {
                        // Clear typing indicator + thinking status on first token
                        bubble.innerHTML = '';
                        firstToken = false;
                    }
                    streamedText += data.token;
                    bubble.innerHTML = streamedText.replace(/\n/g, '<br>');
                    scrollToBottom();
                }
            };

            evtSource.addEventListener('sources', e => {
                sourcesData = JSON.parse(e.data).sources || [];
            });

            evtSource.addEventListener('done', () => {
                evtSource.close();
                activeStream = null;
                sendBtn.disabled = false;

                // FIX: Query timer — show how long it took
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                const timerEl = document.createElement('div');
                timerEl.className = 'query-timer';
                timerEl.textContent = `⚡ ${elapsed}s`;
                msgNode.appendChild(timerEl);

                // Sources accordion
                if (sourcesData.length > 0) {
                    const sourceItems = sourcesData.map((src, i) => {
                        const parts = src.id ? src.id.split(':') : [];
                        const fileBase = parts.slice(0, -2).join(':') || 'Unknown';
                        const pageNum = parts.length >= 2 ? parseInt(parts[parts.length - 2]) + 1 : '?';
                        // Normalize score: ChromaDB distance → similarity %
                        const simPct = src.score <= 2
                            ? Math.round((1 - src.score / 2) * 100)
                            : Math.round((1 / (1 + src.score)) * 100);
                        return `
                        <div class="source-card">
                            <div class="source-header">
                                <span>Source #${i + 1}: ${fileBase}</span>
                                <span>Page ${pageNum} &nbsp;<span class="source-score">${simPct}% match</span></span>
                            </div>
                            <div class="source-text">${src.content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                        </div>`;
                    }).join('');

                    const srcDiv = document.createElement('div');
                    srcDiv.className = 'message-sources';
                    srcDiv.innerHTML = `
                    <div class="sources-trigger" onclick="toggleSources('${msgId}')">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        View Source Context (${sourcesData.length})
                    </div>
                    <div class="sources-content" id="src-${msgId}">${sourceItems}</div>`;
                    msgNode.appendChild(srcDiv);
                    scrollToBottom();
                }
            });

            evtSource.addEventListener('error', () => {
                evtSource.close();
                activeStream = null;
                sendBtn.disabled = false;
                if (firstToken) {
                    bubble.innerHTML = '⚠️ Failed to get a response. Check your API key or model server.';
                }
            });
        }

        function appendUserMessage(text) {
            const node = document.createElement('div');
            node.className = 'message user';
            node.innerHTML = `<div class="message-bubble">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')}</div>`;
            messagesContainer.appendChild(node);
            scrollToBottom();
        }

        window.toggleSources = function (msgId) {
            const el = document.getElementById(`src-${msgId}`);
            if (el) { el.classList.toggle('show'); scrollToBottom(); }
        };

        function scrollToBottom() {
            setTimeout(() => {
                const ws = document.getElementById('workspace');
                ws.scrollTo({ top: ws.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        newChatBtn.addEventListener('click', clearChat);
        recentChatPill.addEventListener('click', clearChat);

        function clearChat() {
            if (activeStream) { activeStream.close(); activeStream = null; }
            sendBtn.disabled = false;
            messagesContainer.innerHTML = '';
            dashboard.classList.remove('hidden');
            chatView.classList.add('hidden');
            isChatActive = false;
            chatInput.value = '';
            chatInput.style.height = 'auto';
        }

        loadDocumentsList();
    </script>
</body>

</html>
